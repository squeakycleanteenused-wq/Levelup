<!doctype html>
<html lang="et"><meta charset="utf-8">
<style>
  body { width: 340px; font: 14px system-ui, sans-serif; margin: 12px; }
  body.tab { width: auto; max-width: 520px; margin: 24px auto; }
  .link { background: none; color: #c2410c; padding: 0; text-decoration: underline; }
  label { display: block; margin-top: 8px; font-size: 12px; opacity: .75; }
  input { width: 100%; box-sizing: border-box; padding: 6px; }
  button { margin-top: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: #c2410c; color: #fff; cursor: pointer; }
  #status { margin-top: 10px; font-size: 13px; } .err { color: #c00; } .ok { color: #166534; }
  details { margin-top: 10px; }
</style>
<h3 style="margin:0">🍁 Levelup Stuudiumi sild</h3>
<div id="status">Laen…</div>
<button id="sync">Uuenda kohe</button>
<div id="tabhint" style="margin-top:8px"><button class="link" id="openTab">Ava seaded eraldi vahelehel (kui aken sulgub)</button></div>
<details id="cfg"><summary>Seaded</summary>
  <label>Perekonna parool (sama mis äpis, vähemalt 8 märki, ainult teie pere teada)</label><input id="password" type="password" autocomplete="off">
  <label>Kooli aadress (nt variku.ope.ee)</label><input id="host">
  <label>Klassijuhataja eesnimi (nt Olena)</label><input id="teacher">
  <label>Klass (nt 5b)</label><input id="className">
  <details style="margin-top:12px"><summary style="font-size:12px;opacity:.7">Täpsemalt (tavaliselt ei pea muutma)</summary>
    <label>Supabase'i aadress</label><input id="supabaseUrl" placeholder="https://xxxx.supabase.co">
    <label>Supabase'i võti</label><input id="supabaseKey">
    <label>Uuenda iga (min, 0 = ainult käsitsi, vähemalt 15)</label><input id="everyMin" type="number" min="0">
    <label>Õpilase id (tühi = tuvasta ise)</label><input id="studentId">
  </details>
  <button id="save">Salvesta seaded</button>
</details>
<script type="module" src="./src/popup.ts"></script>
</html>
